# SQLite configuration for service integration tests (profile: sqlite).
#
# SQLite is an embedded, serverless database that runs entirely in-process.
# No Docker, no external server required.
#
# jdbc:sqlite:file::memory:?cache=shared  → in-memory database shared across
# connections in the same JVM process.
#
# maximum-pool-size=1 is required: SQLite does not support concurrent write
# connections. With a single connection in the pool, HikariCP never opens a
# second connection, so the shared in-memory database is always visible.

spring.datasource.url=jdbc:sqlite:file::memory:?cache=shared
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
