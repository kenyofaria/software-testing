spring.application.name=integration-test-sample

# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/sell_system_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
# Specifically tell Hibernate to use MySQL optimization
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Force the use of InnoDB (supports transactions)
spring.jpa.properties.hibernate.dialect.storage_engine=innodb