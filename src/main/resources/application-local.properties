# LOCAL environment — developer machine, no external services required.
# Uses H2 in-memory database so the application can start without MySQL.
# Activate with: spring.profiles.active=local

spring.datasource.url=jdbc:h2:mem:localdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# H2 web console available at http://localhost:8080/h2-console
# spring.h2.console.enabled=true
